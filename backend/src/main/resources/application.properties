# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/medical_continuity?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/medical-documents

# JWT
jwt.secret=medicalcontinuitysecretkeythatmustbe32charslong!!
jwt.expiration=86400000

# AI Service
ai.service.url=http://localhost:5000

# Server
server.port=8080
