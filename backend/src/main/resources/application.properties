# H2 Database (for development/demo)
spring.datasource.url=jdbc:h2:mem:medical_continuity;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/medical-documents

# JWT
jwt.secret=medicalcontinuitysecretkeythatmustbe32charslong!!
jwt.expiration=86400000

# AI Service
ai.service.url=http://localhost:5000

# Server
server.port=8080
